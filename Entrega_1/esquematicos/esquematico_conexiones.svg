<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 910" width="1260" height="910" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1260" height="910" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#111">Esquema de conexiones — Brazo robótico 4 GDL</text>
  <text x="40" y="68" font-size="14" fill="#555">ESP32 DevKit · PCA9685 · VL53L0X · 5 servos MG90S · Fuente de laboratorio 6,0 V · Lab. 1 Fundamentos de Robótica USACH 2026</text>

  <!-- Leyenda -->
  <g font-size="13" fill="#222">
    <line x1="40" y1="100" x2="80" y2="100" stroke="#c0392b" stroke-width="4"/><text x="88" y="105">+6 V servos</text>
    <line x1="190" y1="100" x2="230" y2="100" stroke="#222" stroke-width="4"/><text x="238" y="105">GND</text>
    <line x1="300" y1="100" x2="340" y2="100" stroke="#8e44ad" stroke-width="4"/><text x="348" y="105">3,3 V lógica</text>
    <line x1="460" y1="100" x2="500" y2="100" stroke="#2471a3" stroke-width="4"/><text x="508" y="105">SDA</text>
    <line x1="560" y1="100" x2="600" y2="100" stroke="#27ae60" stroke-width="4"/><text x="608" y="105">SCL</text>
    <circle cx="680" cy="100" r="5" fill="#111"/><text x="692" y="105">punto = conexión · cruce sin punto = NO conectado</text>
    <line x1="40" y1="126" x2="80" y2="126" stroke="#2471a3" stroke-width="4" stroke-dasharray="9 5"/>
    <line x1="88" y1="126" x2="128" y2="126" stroke="#27ae60" stroke-width="4" stroke-dasharray="9 5"/>
    <text x="136" y="131">punteado = bus I²C 2 solo del sensor ToF (GPIO18 SDA2 / GPIO19 SCL2) · continuo = bus 1 del PCA9685 (GPIO21 SDA / GPIO22 SCL)</text>
  </g>

  <!-- ===================== Cables logicos (horizontales) ===================== -->
  <g fill="none" stroke-width="3">
    <line x1="280" y1="200" x2="600" y2="200" stroke="#222"/>
    <line x1="280" y1="280" x2="600" y2="280" stroke="#27ae60"/>
    <line x1="280" y1="320" x2="600" y2="320" stroke="#2471a3"/>
    <line x1="280" y1="360" x2="600" y2="360" stroke="#8e44ad"/>
    <!-- derivaciones de alimentacion al VL53L0X -->
    <line x1="380" y1="360" x2="380" y2="640" stroke="#8e44ad"/>
    <line x1="410" y1="200" x2="410" y2="640" stroke="#222"/>
    <!-- bus I2C 2 (Wire1) exclusivo del VL53L0X -->
    <polyline points="280,400 470,400 470,640" stroke="#2471a3" stroke-dasharray="9 5"/>
    <polyline points="280,420 440,420 440,640" stroke="#27ae60" stroke-dasharray="9 5"/>
  </g>
  <g fill="#111">
    <circle cx="380" cy="360" r="5"/>
    <circle cx="410" cy="200" r="5"/>
  </g>
  <g font-size="12" fill="#444">
    <text x="292" y="394">SDA2 (ToF)</text>
    <text x="292" y="436">SCL2 (ToF)</text>
  </g>
  <g font-size="12" fill="#444">
    <text x="292" y="194">GND</text>
    <text x="292" y="274">SCL</text>
    <text x="292" y="314">SDA</text>
    <text x="292" y="354">3V3</text>
  </g>

  <!-- ===================== ESP32 ===================== -->
  <rect x="60" y="150" width="220" height="370" rx="8" fill="#eaf2fb" stroke="#1f3b57" stroke-width="2"/>
  <text x="170" y="182" font-size="18" font-weight="700" text-anchor="middle" fill="#1f3b57">ESP32 DevKit</text>
  <text x="170" y="200" font-size="12" text-anchor="middle" fill="#1f3b57">(ESP32-WROOM-32)</text>
  <g font-size="13" fill="#111" text-anchor="end">
    <text x="270" y="204">GND</text>
    <text x="270" y="284">GPIO22 (SCL)</text>
    <text x="270" y="324">GPIO21 (SDA)</text>
    <text x="270" y="364">3V3</text>
    <text x="270" y="404">GPIO18 (SDA2)</text>
    <text x="270" y="424">GPIO19 (SCL2)</text>
    <text x="270" y="474">VIN</text>
  </g>
  <g fill="#1f3b57">
    <circle cx="280" cy="200" r="5"/><circle cx="280" cy="280" r="5"/><circle cx="280" cy="320" r="5"/>
    <circle cx="280" cy="360" r="5"/><circle cx="280" cy="400" r="5"/><circle cx="280" cy="420" r="5"/>
    <circle cx="280" cy="470" r="5" fill="#fff" stroke="#1f3b57" stroke-width="2"/>
  </g>
  <text x="270" y="492" font-size="11" fill="#a04000" text-anchor="end">sin conectar</text>
  <text x="270" y="506" font-size="11" fill="#a04000" text-anchor="end">(ESP32 solo por USB)</text>
  <!-- USB -->
  <rect x="36" y="250" width="24" height="44" rx="3" fill="#bbb" stroke="#555"/>
  <text x="72" y="268" font-size="12" fill="#333">USB</text>
  <text x="72" y="284" font-size="11" fill="#555">→ PC</text>
  <text x="72" y="298" font-size="11" fill="#555">(programa y</text>
  <text x="72" y="312" font-size="11" fill="#555">alimenta la ESP32)</text>

  <!-- ===================== PCA9685 ===================== -->
  <rect x="600" y="150" width="260" height="380" rx="8" fill="#eef8ee" stroke="#1e5631" stroke-width="2"/>
  <g font-size="13" fill="#111">
    <text x="614" y="204">GND</text>
    <text x="614" y="244" fill="#888">OE (sin conectar)</text>
    <text x="614" y="284">SCL</text>
    <text x="614" y="324">SDA</text>
    <text x="614" y="364">VCC (lógica 3,3 V)</text>
    <text x="614" y="404" fill="#888">V+ (sin conectar)</text>
  </g>
  <g fill="#1e5631">
    <circle cx="600" cy="200" r="5"/><circle cx="600" cy="240" r="5" fill="#fff" stroke="#1e5631" stroke-width="2"/>
    <circle cx="600" cy="280" r="5"/><circle cx="600" cy="320" r="5"/><circle cx="600" cy="360" r="5"/>
    <circle cx="600" cy="400" r="5" fill="#fff" stroke="#1e5631" stroke-width="2"/>
  </g>
  <text x="730" y="455" font-size="18" font-weight="700" text-anchor="middle" fill="#1e5631">PCA9685</text>
  <text x="730" y="473" font-size="12" text-anchor="middle" fill="#1e5631">driver PWM 16 canales · I²C 0x40</text>
  <g font-size="12" fill="#111" text-anchor="end">
    <text x="850" y="204">canal 0</text>
    <text x="850" y="264">canal 1</text>
    <text x="850" y="324">canal 2</text>
    <text x="850" y="384">canal 3</text>
    <text x="850" y="444">canal 4</text>
  </g>
  <!-- bornera de potencia -->
  <rect x="650" y="500" width="160" height="30" rx="3" fill="#2e86c1" stroke="#1b4f72"/>
  <text x="680" y="520" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">V+</text>
  <text x="780" y="520" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">GND</text>
  <text x="730" y="492" font-size="11" fill="#1b4f72" text-anchor="middle">bornera de potencia</text>

  <!-- ===================== Potencia ===================== -->
  <line x1="680" y1="530" x2="680" y2="660" stroke="#c0392b" stroke-width="4"/>
  <line x1="780" y1="530" x2="780" y2="660" stroke="#222" stroke-width="4"/>
  <!-- condensador C1 -->
  <line x1="680" y1="595" x2="722" y2="595" stroke="#c0392b" stroke-width="3"/>
  <line x1="722" y1="580" x2="722" y2="610" stroke="#111" stroke-width="3"/>
  <path d="M738 580 Q730 595 738 610" fill="none" stroke="#111" stroke-width="3"/>
  <line x1="734" y1="595" x2="780" y2="595" stroke="#222" stroke-width="3"/>
  <circle cx="680" cy="595" r="5" fill="#111"/><circle cx="780" cy="595" r="5" fill="#111"/>
  <text x="712" y="575" font-size="12" fill="#111">+</text>
  <text x="792" y="592" font-size="12" fill="#111">C1 1000 µF / 16 V</text>
  <text x="792" y="607" font-size="11" fill="#555">(470–1000 µF, electrolítico)</text>

  <rect x="600" y="660" width="260" height="88" rx="8" fill="#fdf2e9" stroke="#a04000" stroke-width="2"/>
  <circle cx="680" cy="660" r="7" fill="#c0392b"/><circle cx="780" cy="660" r="7" fill="#222"/>
  <text x="680" y="684" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">+</text>
  <text x="780" y="684" font-size="13" font-weight="700" text-anchor="middle" fill="#222">−</text>
  <text x="730" y="710" font-size="15" font-weight="700" text-anchor="middle" fill="#a04000">Fuente de laboratorio</text>
  <text x="730" y="730" font-size="13" text-anchor="middle" fill="#a04000">6,0 V · límite de corriente 3 A</text>

  <!-- ===================== VL53L0X ===================== -->
  <rect x="355" y="640" width="225" height="108" rx="8" fill="#f4ecf7" stroke="#5b2c6f" stroke-width="2"/>
  <g fill="#5b2c6f">
    <circle cx="380" cy="640" r="5"/><circle cx="410" cy="640" r="5"/><circle cx="440" cy="640" r="5"/><circle cx="470" cy="640" r="5"/>
    <circle cx="510" cy="640" r="5" fill="#fff" stroke="#5b2c6f" stroke-width="2"/>
    <circle cx="552" cy="640" r="5" fill="#fff" stroke="#5b2c6f" stroke-width="2"/>
  </g>
  <g font-size="10" fill="#111" text-anchor="middle">
    <text x="380" y="660">VIN</text><text x="410" y="660">GND</text><text x="440" y="660">SCL2</text>
    <text x="470" y="660">SDA2</text><text x="510" y="660" fill="#888">GPIO1</text><text x="552" y="660" fill="#888">XSHUT</text>
  </g>
  <text x="467" y="692" font-size="16" font-weight="700" text-anchor="middle" fill="#5b2c6f">VL53L0X (V2)</text>
  <text x="467" y="710" font-size="12" text-anchor="middle" fill="#5b2c6f">sensor ToF · I²C 0x29</text>
  <text x="467" y="728" font-size="11" text-anchor="middle" fill="#888">GPIO1 y XSHUT sin conectar</text>

  <!-- ===================== Servos ===================== -->
  <g stroke-width="3">
    <g transform="translate(0,200)">
      <line x1="860" y1="-7" x2="990" y2="-7" stroke="#e67e22"/><line x1="860" y1="0" x2="990" y2="0" stroke="#c0392b"/><line x1="860" y1="7" x2="990" y2="7" stroke="#6e2c00"/>
    </g>
    <g transform="translate(0,260)">
      <line x1="860" y1="-7" x2="990" y2="-7" stroke="#e67e22"/><line x1="860" y1="0" x2="990" y2="0" stroke="#c0392b"/><line x1="860" y1="7" x2="990" y2="7" stroke="#6e2c00"/>
    </g>
    <g transform="translate(0,320)">
      <line x1="860" y1="-7" x2="990" y2="-7" stroke="#e67e22"/><line x1="860" y1="0" x2="990" y2="0" stroke="#c0392b"/><line x1="860" y1="7" x2="990" y2="7" stroke="#6e2c00"/>
    </g>
    <g transform="translate(0,380)">
      <line x1="860" y1="-7" x2="990" y2="-7" stroke="#e67e22"/><line x1="860" y1="0" x2="990" y2="0" stroke="#c0392b"/><line x1="860" y1="7" x2="990" y2="7" stroke="#6e2c00"/>
    </g>
    <g transform="translate(0,440)">
      <line x1="860" y1="-7" x2="990" y2="-7" stroke="#e67e22"/><line x1="860" y1="0" x2="990" y2="0" stroke="#c0392b"/><line x1="860" y1="7" x2="990" y2="7" stroke="#6e2c00"/>
    </g>
  </g>
  <g font-size="13">
    <rect x="990" y="178" width="230" height="44" rx="6" fill="#fef9e7" stroke="#7d6608" stroke-width="2"/>
    <text x="1004" y="197" font-weight="700">Servo 0 · Base (q1)</text><text x="1004" y="214" font-size="12" fill="#555">MG90S</text>
    <rect x="990" y="238" width="230" height="44" rx="6" fill="#fef9e7" stroke="#7d6608" stroke-width="2"/>
    <text x="1004" y="257" font-weight="700">Servo 1 · Hombro (q2)</text><text x="1004" y="274" font-size="12" fill="#555">MG90S</text>
    <rect x="990" y="298" width="230" height="44" rx="6" fill="#fef9e7" stroke="#7d6608" stroke-width="2"/>
    <text x="1004" y="317" font-weight="700">Servo 2 · Codo (q3)</text><text x="1004" y="334" font-size="12" fill="#555">MG90S</text>
    <rect x="990" y="358" width="230" height="44" rx="6" fill="#fef9e7" stroke="#7d6608" stroke-width="2"/>
    <text x="1004" y="377" font-weight="700">Servo 3 · Muñeca (q4)</text><text x="1004" y="394" font-size="12" fill="#555">MG90S</text>
    <rect x="990" y="418" width="230" height="44" rx="6" fill="#fef9e7" stroke="#7d6608" stroke-width="2"/>
    <text x="1004" y="437" font-weight="700">Servo 4 · Pinza</text><text x="1004" y="454" font-size="12" fill="#555">MG90S</text>
  </g>
  <g font-size="12" fill="#222">
    <text x="870" y="490">Cable de cada servo → su canal:</text>
    <line x1="870" y1="505" x2="900" y2="505" stroke="#e67e22" stroke-width="4"/><text x="906" y="509">naranja / amarillo → PWM</text>
    <line x1="870" y1="523" x2="900" y2="523" stroke="#c0392b" stroke-width="4"/><text x="906" y="527">rojo → V+</text>
    <line x1="870" y1="541" x2="900" y2="541" stroke="#6e2c00" stroke-width="4"/><text x="906" y="545">café / negro → GND (borde de la placa)</text>
  </g>

  <!-- ===================== Notas ===================== -->
  <rect x="40" y="772" width="1180" height="124" rx="8" fill="#fafafa" stroke="#999"/>
  <text x="56" y="796" font-size="15" font-weight="700" fill="#b03a2e">Reglas importantes</text>
  <g font-size="13" fill="#222">
    <text x="56" y="818">1. Ajusta la fuente a 6,0 V y 3 A con la salida APAGADA y desconectada; recién después conéctala y enciéndela. Más de 6 V quema los servos.</text>
    <text x="56" y="838">2. La ESP32 se alimenta SOLO por USB (PC, cargador o power bank). Nunca alimentes servos desde el 3V3/5V/VIN de la ESP32.</text>
    <text x="56" y="858">3. GND común: la GND de la ESP32 llega al PCA9685 por el conector lógico, y la placa la une con la GND de la bornera y de la fuente.</text>
    <text x="56" y="878">4. C1 electrolítico: pata larga (+) a V+, franja (−) a GND. Ubica cada pin por su rótulo serigrafiado: el orden físico cambia según el modelo de placa.</text>
  </g>
</svg>
