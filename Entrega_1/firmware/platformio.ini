; Brazo robotico 4 GDL - Laboratorio 1 Fundamentos de Robotica (USACH S2-2026)
; Placa: ESP32 DevKit (ESP32-WROOM-32)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Bluetooth clasico no cabe en la particion por defecto (1,25 MB); sin OTA tenemos 3 MB.
board_build.partitions = huge_app.csv
; El PCA9685 se maneja directo por registros (src/actuadores.h): la libreria de Adafruit
; ponia el chip a 1 kHz al iniciar y soltaba los servos en cada reinicio de la ESP32.
lib_deps =
    pololu/VL53L0X@^1.3.1
